name: opv2v_cods_dynamic
root_dir: "/data2/wjl/DATA/OPV2V/train"
validate_dir: "/data2/wjl/DATA/OPV2V/validate"
test_dir: "/data2/wjl/DATA/OPV2V/test"

yaml_parser: load_point_pillar_detseg_params
train_params:
  batch_size: 2
  epoches: 30
  eval_freq: 5
  save_freq: 1
  max_cav: &max_cav 5
  visible: true

input_source: [lidar]
label_type: lidar
comm_range: 70
device: cuda
train: true
task: [seg, det]

add_data_extension:
  - bev_dynamic.png
  - bev_static.png
  - bev_lane.png
  - bev_visibility.png
  - bev_visibility_corp.png

fusion:
  core_method: IntermediateFusionSegDatasetOPV2V
  args:
    # CoRM expects per-agent inputs to be projected into the ego frame.
    proj_first: true

preprocess:
  core_method: SpVoxelPreprocessor
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-140.8, -51.2, -3, 140.8, 51.2, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [x]
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: VoxelPostprocessor
  anchor_args:
    cav_lidar_range: [-140.8, -38.4, -3, 140.8, 38.4, 1]
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: hwl
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: point_pillar_cods
  args:
    target: &target dynamic
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num
    max_cav: *max_cav
    backbone_fix: false
    supervise_single: false

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      voxel_size: *voxel_size

    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384

    decoder:
      input_dim: 256
      num_layer: 3
      num_ch_dec: [64, 128, 256]
    seg_head_dim: 64
    static_output_class: 3
    dynamic_output_class: 2

    use_btci: true
    btci_alpha: 0.05
    btci_reduction: 8
    btci_use_spatial_reliability: false

    s_moe_args:
      use_reliability: true
      target: *target
      in_channels: 256
      out_channels: 256
      confidence_channels: 32
      dropout: 0.1
      base_grid_conf:
        xbound: [-140.8, 140.8, 0.4]
        ybound: [-51.2, 51.2, 0.4]
      fg_grid_conf:
        xbound: [-140.8, 140.8, 0.4]
        ybound: [-51.2, 51.2, 0.4]
      bg_grid_conf:
        xbound: [-30.0, 30.0, 0.15]
        ybound: [-15.0, 15.0, 0.15]

loss:
  core_method: point_pillar_loss_detseg
  args:
    cls_weight: 1.0
    reg: 2.0
    target: *target
    d_weights: 15.0
    s_weights: 2.0
    l_weights: 4.0
    d_coe: 2.0
    s_coe: 1.0

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1.0e-10
    weight_decay: 1.0e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 20]
